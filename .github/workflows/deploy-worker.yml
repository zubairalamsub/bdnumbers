name: deploy-worker

on:
  push:
    branches: [main]
    paths:
      - worker/**
      - shared/**
      - package-lock.json
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

# Least privilege: the GITHUB_TOKEN can only read the code.
permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets are not set; skipping deploy. See README > Setup."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.secrets.outputs.ok == 'true'
      - run: npm test
        if: steps.secrets.outputs.ok == 'true'
      - name: Apply D1 migrations
        if: steps.secrets.outputs.ok == 'true'
        working-directory: worker
        run: npx wrangler d1 migrations apply bdnumbers --remote
      - name: Deploy
        if: steps.secrets.outputs.ok == 'true'
        working-directory: worker
        run: npx wrangler deploy
