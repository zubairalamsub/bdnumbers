name: lighthouse

# Fails when any audited page scores under 95 on mobile in performance, accessibility, best
# practices or SEO (median of 3 runs; thresholds in site/lighthouserc.json).
on:
  push:
    branches: [main]
    paths: ['site/**', 'shared/**', 'package.json', 'package-lock.json', '.github/workflows/lighthouse.yml']
  pull_request:
    paths: ['site/**', 'shared/**', 'package.json', 'package-lock.json', '.github/workflows/lighthouse.yml']

# Least privilege: the GITHUB_TOKEN can only read the code.
permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Builds against the live API, so a site that can't render today's data fails CI. On failure the end of
      # the output becomes an error annotation, which GitHub shows without signing in (the logs need a login).
      - name: Build site
        shell: bash
        run: |
          set -o pipefail
          if ! npm run build -w site 2>&1 | tee build.log; then
            echo "::error title=Site build failed::$(tail -c 4000 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
      - name: Lighthouse CI
        working-directory: site
        run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: site/.lighthouseci/reports
          if-no-files-found: ignore
