name: test

on:
  push:
  pull_request:

# Least privilege: the GITHUB_TOKEN can only read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Builds against the live API, so a site that can't render today's data fails CI.
      - run: npm run build -w site
